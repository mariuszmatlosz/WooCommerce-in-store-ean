name: Release

on:
  push:
    branches: ["master", "main"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Zip the plugin
        run: |
          rm -f ean-to-pos.zip
          (cd build && zip -r ../ean-to-pos.zip ean-to-pos)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^ \* Version:[[:space:]]*//p' ean-to-pos.php)
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ean-to-pos.zip --clobber
          else
            gh release create "$tag" ean-to-pos.zip \
              --title "EAN to PoS ${version}" \
              --notes "Plugin package for version ${version}."
          fi
